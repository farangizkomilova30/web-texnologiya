```html
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>WebSocket Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
    }

    .chat {
      width: 90%;
      max-width: 500px;
      height: 80vh;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #4CAF50, #66BB6A);
      color: white;
      padding: 20px;
      font-size: 20px;
      text-align: center;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #f9f9f9;
    }

    .message {
      padding: 10px 15px;
      margin: 8px 0;
      border-radius: 15px;
      max-width: 70%;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
    }

    .me {
      background: #4CAF50;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 5px;
    }

    .other {
      background: #e0e0e0;
      color: #333;
      border-bottom-left-radius: 5px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 25px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 14px;
    }

    button {
      margin-left: 10px;
      padding: 12px 18px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(135deg, #4CAF50, #66BB6A);
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>

<div class="chat">
  <div class="header">💬 WebSocket Chat</div>
  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input type="text" id="msg" placeholder="Xabar yozing..." onkeypress="handleKey(event)">
    <button onclick="sendMessage()">Yubor</button>
  </div>
</div>

<script>
  const socket = new WebSocket("wss://echo.websocket.events");
  const messages = document.getElementById("messages");

  socket.onopen = () => {
    addMessage("Serverga ulandi", "other");
  };

  socket.onmessage = (event) => {
    addMessage(event.data, "other");
  };

  function sendMessage() {
    const input = document.getElementById("msg");
    const text = input.value;

    if (text.trim() === "") return;

    socket.send(text);
    addMessage(text, "me");
    input.value = "";
  }

  function handleKey(e) {
    if (e.key === "Enter") {
      sendMessage();
    }
  }

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.innerText = text;

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }
</script>

</body>
</html>
